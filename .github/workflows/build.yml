name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore src\YikaiPHP.csproj

      - name: Build
        run: dotnet build src\YikaiPHP.csproj -c Release --no-restore

      - name: Verify self-contained single-file publish
        run: >-
          dotnet publish src\YikaiPHP.csproj -c Release -r win-x64
          --self-contained true -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true -p:DebugType=None
          -o artifacts\panel
